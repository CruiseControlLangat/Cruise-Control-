<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise Control | Fleet Manager</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #d32f2f;
            --background-color: #f4f7f6;
            --success-color: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--background-color); margin: 0; padding-bottom: 40px; }
        
        header { text-align: center; padding: 20px 20px 15px 20px; background: #ffffff; border-bottom: 3px solid var(--primary-color); margin-bottom: 25px; border-radius: 0 0 15px 15px; }
        .top-nav { margin: 15px 0; }
        .top-nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .top-nav a { text-decoration: none; color: var(--primary-color); background-color: #e9f0f8; padding: 8px 16px; border-radius: 5px; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; }
        .top-nav a:hover, .top-nav a.active { background-color: var(--primary-color); color: white; }
        .logout-btn { background-color: var(--secondary-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 0.8rem; }

        .container { max-width: 1000px; margin: 0 auto; padding: 0 20px; display: grid; grid-template-columns: 1fr 1.5fr; gap: 20px; }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }

        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h2 { color: var(--primary-color); margin-top: 0; font-size: 1.3rem; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; }
        .btn:hover { background-color: #004085; }

        table { width: 100%; border-collapse: collapse; font-size: 0.85rem; margin-top: 10px; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #eee; }
        th { background-color: var(--primary-color); color: white; }
        .badge { background: #eee; padding: 3px 6px; border-radius: 3px; font-weight: bold; }
        .delete-btn { background-color: var(--secondary-color); color: white; border: none; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-size: 0.75rem; }
    </style>
</head>
<body>

    <div id="mainAppSection" style="display: none;">
        <header>
            <h1 style="margin: 0; color: var(--primary-color); font-size: 28px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;">CRUISE CONTROL</h1>
            <p style="margin: 5px 0 0 0; color: var(--secondary-color); font-weight: bold; font-size: 18px; letter-spacing: 0.5px;">Rentals & Logistics</p>

            <nav class="top-nav">
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="fleet.html" class="active">Fleet Manager</a></li>
                    <li><a href="Record.html">Records</a></li>
                    <li><a href="carsrecord.html">Vehicle Ledger</a></li>
                    <li><a href="report.html">Report</a></li>
                </ul>
            </nav>

            <button id="logoutBtn" class="logout-btn">Log Out</button>
        </header>

        <div class="container">
            <!-- Form Card -->
            <div class="card">
                <h2>Add New Vehicle</h2>
                <form id="fleetForm">
                    <div class="form-group">
                        <label>Vehicle Model</label>
                        <input type="text" id="carModel" required placeholder="e.g. Toyota Prado">
                    </div>
                    <div class="form-group">
                        <label>Number Plate</label>
                        <input type="text" id="numberPlate" required placeholder="e.g. KDA 123X">
                    </div>
                    <div class="form-group">
                        <label>Color</label>
                        <input type="text" id="carColor" required placeholder="e.g. White">
                    </div>
                    <button type="submit" class="btn" id="saveBtn">Register Vehicle</button>
                </form>
            </div>

            <!-- List Card -->
            <div class="card">
                <h2>Registered Fleet List</h2>
                <table>
                    <thead>
                        <tr>
                            <th>Model</th>
                            <th>Plate</th>
                            <th>Color</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="fleetTableBody">
                        <tr><td colspan="4" style="text-align:center;">Loading fleet database...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBTYM84E6TSy0Q2QUZSt9MCYn6uAiZ6HpI",
          authDomain: "site-bcb4b.firebaseapp.com",
          projectId: "site-bcb4b",
          storageBucket: "site-bcb4b.firebasestorage.app",
          messagingSenderId: "586333698174",
          appId: "1:586333698174:web:cae8db0888c460047d802f",
          measurementId: "G-2RFQQQ2EPP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('mainAppSection').style.display = 'block';
                loadFleet();
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });

        // Load Fleet List
        async function loadFleet() {
            const tableBody = document.getElementById('fleetTableBody');
            try {
                const snapshot = await getDocs(collection(db, "fleet"));
                tableBody.innerHTML = '';

                if (snapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;">No vehicles registered in fleet.</td></tr>';
                    return;
                }

                snapshot.forEach(docSnap => {
                    const data = docSnap.data();
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${data.model || 'N/A'}</strong></td>
                        <td><span class="badge">${data.plate || 'N/A'}</span></td>
                        <td>${data.color || 'N/A'}</td>
                        <td><button class="delete-btn" onclick="deleteVehicle('${docSnap.id}')">Delete</button></td>
                    `;
                    tableBody.appendChild(row);
                });
            } catch (err) {
                console.error("Error loading fleet:", err);
                tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center; color: var(--secondary-color);">Error loading fleet. Check Firebase Firestore rules.</td></tr>';
            }
        }

        // Add Vehicle
        document.getElementById('fleetForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = "Saving...";

            try {
                await addDoc(collection(db, "fleet"), {
                    model: document.getElementById('carModel').value,
                    plate: document.getElementById('numberPlate').value.toUpperCase(),
                    color: document.getElementById('carColor').value,
                    createdAt: new Date().toISOString()
                });

                alert("Vehicle added to fleet successfully!");
                document.getElementById('fleetForm').reset();
                loadFleet();
            } catch (err) {
                console.error("Error saving vehicle:", err);
                alert(`Failed to save vehicle: ${err.message}`);
            } finally {
                btn.disabled = false;
                btn.textContent = "Register Vehicle";
            }
        });

        // Delete Vehicle
        window.deleteVehicle = async (id) => {
            if (confirm("Are you sure you want to remove this vehicle from the fleet?")) {
                try {
                    await deleteDoc(doc(db, "fleet", id));
                    loadFleet();
                } catch (err) {
                    console.error("Error deleting vehicle:", err);
                    alert("Failed to delete vehicle.");
                }
            }
        };
    </script>
</body>
</html>
