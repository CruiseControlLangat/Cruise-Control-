<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cruise Control | Home</title>
    <style>
        :root {
            --primary-color: #0056b3;
            --secondary-color: #d32f2f;
            --background-color: #f4f7f6;
            --success-color: #28a745;
        }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--background-color); margin: 0; padding-bottom: 40px; }
        
        header { text-align: center; padding: 20px 20px 15px 20px; background: #ffffff; border-bottom: 3px solid var(--primary-color); margin-bottom: 25px; border-radius: 0 0 15px 15px; }
        .top-nav { margin: 15px 0; }
        .top-nav ul { list-style: none; padding: 0; margin: 0; display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .top-nav a { text-decoration: none; color: var(--primary-color); background-color: #e9f0f8; padding: 8px 16px; border-radius: 5px; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; }
        .top-nav a:hover, .top-nav a.active { background-color: var(--primary-color); color: white; }
        .logout-btn { background-color: var(--secondary-color); color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; margin-top: 5px; font-size: 0.8rem; }

        .container { max-width: 600px; margin: 0 auto; padding: 0 20px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card h2 { color: var(--primary-color); margin-top: 0; text-align: center; font-size: 1.4rem; }
        
        .form-group { margin-bottom: 15px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        label { display: block; font-weight: 600; font-size: 0.9rem; margin-bottom: 5px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; font-weight: bold; color: #495057; }

        .calculation-summary { background: #eef5fc; border: 1px solid #b8daff; border-radius: 5px; padding: 12px 15px; margin: 15px 0; font-size: 0.9rem; }
        .calculation-summary div { display: flex; justify-content: space-between; margin-bottom: 5px; }
        .calculation-summary div:last-child { margin-bottom: 0; padding-top: 5px; border-top: 1px dashed #b8daff; }
        
        .btn { background-color: var(--primary-color); color: white; border: none; padding: 12px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn:hover { background-color: #004085; }
    </style>
</head>
<body>

    <div id="mainAppSection" style="display: none;">
        <header>
            <h1 style="margin: 0; color: var(--primary-color); font-size: 28px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800;">CRUISE CONTROL</h1>
            <p style="margin: 5px 0 0 0; color: var(--secondary-color); font-weight: bold; font-size: 18px; letter-spacing: 0.5px;">Rentals & Logistics</p>

            <nav class="top-nav">
                <ul>
                    <li><a href="index.html" class="active">Home</a></li>
                    <li><a href="dashboard.html">Dashboard</a></li>
                    <li><a href="fleet.html">Fleet Manager</a></li>
                    <li><a href="Record.html">Records</a></li>
                    <li><a href="carsrecord.html">Vehicle Ledger</a></li>
                    <li><a href="report.html">Report</a></li>
                </ul>
            </nav>

            <button id="logoutBtn" class="logout-btn">Log Out</button>
        </header>

        <div class="container">
            <div class="card">
                <h2>New Rental Entry</h2>
                <form id="rentalForm">
                    <div class="form-group">
                        <label>Client Name</label>
                        <input type="text" id="clientName" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Phone Number</label>
                        <input type="tel" id="clientPhone" required placeholder="0712345678">
                    </div>
                    <div class="form-group">
                        <label>Select Vehicle from Fleet</label>
                        <select id="vehicleSelect" required>
                            <option value="">-- Loading Fleet... --</option>
                        </select>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Date Taken</label>
                            <input type="date" id="dateTaken" required>
                        </div>
                        <div class="form-group">
                            <label>Number of Days</label>
                            <input type="number" id="daysTaken" required min="1" placeholder="e.g. 3">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Expected Return Date (Auto)</label>
                        <input type="date" id="expectedReturnDate" readonly required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Rate Per Day (KES)</label>
                            <input type="number" id="ratePerDay" required min="0" placeholder="e.g. 3000">
                        </div>
                        <div class="form-group">
                            <label>Initial Payment (KES)</label>
                            <input type="number" id="amountPaid" required min="0" placeholder="0.00">
                        </div>
                    </div>

                    <!-- Financial Summary Preview -->
                    <div class="calculation-summary">
                        <div><span>Total Contract Value:</span> <strong id="summaryTotal">KES 0</strong></div>
                        <div><span>Initial Payment Made:</span> <strong id="summaryPaid" style="color: var(--success-color);">KES 0</strong></div>
                        <div><span>Initial Arrears Balance:</span> <strong id="summaryArrears" style="color: var(--secondary-color);">KES 0</strong></div>
                    </div>

                    <button type="submit" class="btn" id="saveBtn">Save Rental Record</button>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBTYM84E6TSy0Q2QUZSt9MCYn6uAiZ6HpI",
          authDomain: "site-bcb4b.firebaseapp.com",
          projectId: "site-bcb4b",
          storageBucket: "site-bcb4b.firebasestorage.app",
          messagingSenderId: "586333698174",
          appId: "1:586333698174:web:cae8db0888c460047d802f",
          measurementId: "G-2RFQQQ2EPP"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                document.getElementById('mainAppSection').style.display = 'block';
                await populateFleetDropdown();
                
                // Set default date taken to today
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('dateTaken').value = todayStr;
                calculateFormValues();
            } else {
                window.location.href = "login.html";
            }
        });

        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth).then(() => window.location.href = "login.html");
        });

        async function populateFleetDropdown() {
            const select = document.getElementById('vehicleSelect');
            select.innerHTML = '<option value="">-- Choose a Vehicle --</option>';
            
            try {
                const snapshot = await getDocs(collection(db, "fleet"));
                if (snapshot.empty) {
                    select.innerHTML = '<option value="">No vehicles found in Fleet. Add one in Fleet Manager.</option>';
                    return;
                }
                snapshot.forEach(doc => {
                    const data = doc.data();
                    const opt = document.createElement('option');
                    opt.value = JSON.stringify({ model: data.model, plate: data.plate });
                    opt.textContent = `${data.model} (${data.plate}) - ${data.color}`;
                    select.appendChild(opt);
                });
            } catch(e) {
                console.error("Error loading fleet", e);
            }
        }

        // Auto-calculator logic for dates & financial summary
        function calculateFormValues() {
            const dateTakenInput = document.getElementById('dateTaken').value;
            const daysTaken = parseInt(document.getElementById('daysTaken').value) || 0;
            const ratePerDay = parseFloat(document.getElementById('ratePerDay').value) || 0;
            const amountPaid = parseFloat(document.getElementById('amountPaid').value) || 0;

            // 1. Calculate Expected Return Date
            if (dateTakenInput && daysTaken > 0) {
                const returnDate = new Date(dateTakenInput);
                returnDate.setDate(returnDate.getDate() + daysTaken);
                document.getElementById('expectedReturnDate').value = returnDate.toISOString().split('T')[0];
            } else {
                document.getElementById('expectedReturnDate').value = '';
            }

            // 2. Calculate Financial Summary
            const totalCost = daysTaken * ratePerDay;
            const arrears = Math.max(0, totalCost - amountPaid);

            document.getElementById('summaryTotal').innerText = `KES ${totalCost.toLocaleString()}`;
            document.getElementById('summaryPaid').innerText = `KES ${amountPaid.toLocaleString()}`;
            document.getElementById('summaryArrears').innerText = arrears > 0 ? `KES ${arrears.toLocaleString()}` : `Cleared`;
        }

        // Attach calculation listeners to input events
        ['dateTaken', 'daysTaken', 'ratePerDay', 'amountPaid'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateFormValues);
        });

        document.getElementById('rentalForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.textContent = "Saving...";

            const vehicleData = JSON.parse(document.getElementById('vehicleSelect').value);
            const initialPayment = Number(document.getElementById('amountPaid').value) || 0;
            const daysTaken = Number(document.getElementById('daysTaken').value) || 0;
            const ratePerDay = Number(document.getElementById('ratePerDay').value) || 0;
            const totalAgreedPrice = daysTaken * ratePerDay;
            const dateTaken = document.getElementById('dateTaken').value;
            const arrearsRemaining = Math.max(0, totalAgreedPrice - initialPayment);

            try {
                await addDoc(collection(db, "rentals"), {
                    clientName: document.getElementById('clientName').value,
                    clientPhone: document.getElementById('clientPhone').value,
                    carModel: vehicleData.model,
                    numberPlate: vehicleData.plate,
                    dateTaken: dateTaken,
                    daysTaken: daysTaken,
                    ratePerDay: ratePerDay,
                    totalAgreedPrice: totalAgreedPrice,
                    expectedReturnDate: document.getElementById('expectedReturnDate').value,
                    status: "Active",
                    amountPaid: initialPayment,
                    arrearsRemaining: arrearsRemaining,
                    paymentHistory: [
                        { date: dateTaken, amount: initialPayment }
                    ],
                    createdAt: new Date().toISOString()
                });

                alert("Rental record created successfully!");
                document.getElementById('rentalForm').reset();
                
                // Reset defaults
                const todayStr = new Date().toISOString().split('T')[0];
                document.getElementById('dateTaken').value = todayStr;
                calculateFormValues();
            } catch (err) {
                console.error("Error saving rental:", err);
                alert("Failed to save rental record.");
            } finally {
                btn.disabled = false;
                btn.textContent = "Save Rental Record";
            }
        });
    </script>
</body>
</html>
